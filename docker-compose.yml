version: '3'

services:
  db:
    image: postgres:17.1
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - 'postgres:/var/lib/postgresql/data'
      - '../dumps:/tmp/dumps'
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    depends_on:
      - db
    env_file:
      - .env
    user: node  # This should match your host user ID
    command: sh -c "pnpm install && pnpm dev"

volumes:
  data:
  node_modules:
  postgres:
