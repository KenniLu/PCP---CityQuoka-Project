# version: '3'
services:
  db:
    image: postgres:17.1
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - 'postgres:/var/lib/postgresql/data'
      - '../dumps:/tmp/dumps'
  minio:
    image: minio/minio:latest
    env_file:
      - .env
    environment:
      - MINIO_ROOT_USER=${_AWS_ACCESS_KEY_ID}
      - MINIO_ROOT_PASSWORD=${_AWS_SECRET_ACCESS_KEY}
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"  # S3 API port
      - "9001:9001"  # Web Console port
    volumes:
      - minio-data:/data
      - ./minio-init:/minio-init
    entrypoint: >
      /bin/sh -c "
      chmod +x /minio-init/init-bucket.sh;
      /minio-init/init-bucket.sh & 
      minio server --console-address ':9001' /data
      "
  valkey:
    image: valkey/valkey:latest
    ports:
      - "6379:6379"
      - "8001:8001"
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
      # - '9229:9229' # Uncomment for Debugging
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    depends_on:
      - db
      - minio
      - valkey
    env_file:
      - .env
    user: node # This should match your host user ID
    command: sh -c "pnpm install && pnpm dev"  # Use "pnpm dev:debug" instead of "pnpm dev" for Debugging,

volumes:
  data:
  node_modules:
  postgres:
  minio-data:
