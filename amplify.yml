version: 1
frontend:
  phases:
    preBuild:
      commands:
        - pwd             # Print working directory
        - ls -la         # List all files
        - ls -ltr ./src/providers/*
        - npm install -g pnpm
        - pnpm install
    build:
      commands:
        - sudo mkdir -p /opt/certs
        - sudo cp certs/us-east-1-bundle.pem /opt/certs
        - pnpm run payload migrate && pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
