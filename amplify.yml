version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install -g pnpm
        - pnpm install
    build:
      commands:
        - echo "AUTH_SECRET=$AUTH_SECRET" >> .env
        - echo "PAYLOAD_SECRET=$PAYLOAD_SECRET" >> .env
        - echo "DATABASE_URI=$DATABASE_URI" >> .env
        - echo "NODE_ENV=$NODE_ENV" >> .env
        - echo "POSTGRES_SSL_CERT_PATH=$POSTGRES_SSL_CERT_PATH" >> .env
        - NEXT_TELEMETRY_DISABLED=1 pnpm run payload migrate && pnpm run build
  artifacts:
    baseDirectory: .
    files:
      - .next/**/*
      - public/**/*
      - certs/**/*
      - package.json
      - next.config.js
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
